name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  submission-structure:
    name: Student submission structure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate student Pull Request scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/validate-student-submission.sh "$BASE_SHA"

  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts syntax
        run: |
          bash -n scripts/validate-student-submission.sh
          bash -n scripts/new-student-bot.sh
          bash -n scripts/chess.sh
          bash -n scripts/test-student-submission-validator.sh

      - name: Self-test student Pull Request validator
        run: bash scripts/test-student-submission-validator.sh

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

  student-workflow-linux:
    name: Student workflow — Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Scaffold student bots
        run: |
          bash scripts/new-student-bot.sh CiSmokeBot "CI Student One" "CI Smoke" "Premier bot généré par le smoke-test du parcours étudiant."
          bash scripts/new-student-bot.sh CiSecondBot "CI Student Two" "CI Second" "Second bot généré pour tester le tournoi étudiant automatique."

      - name: Build student bot and executable runner
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate generated student bot
        run: |
          bash scripts/chess.sh validate-students | tee /tmp/validate-students.txt
          grep -q "CI Smoke" /tmp/validate-students.txt
          grep -q "CI Second" /tmp/validate-students.txt

      - name: Verify automatic catalog registration
        run: |
          bash scripts/chess.sh list | tee /tmp/bot-list.txt
          grep -q "student-ci-smoke" /tmp/bot-list.txt
          grep -q "student-ci-second" /tmp/bot-list.txt

      - name: Play isolated student duel
        run: bash scripts/chess.sh console student-ci-smoke random --isolated --max-plies=4 --timeout-ms=2000 --heap-mb=128

      - name: Run isolated mini tournament and exports
        run: |
          bash scripts/chess.sh tournament student-ci-smoke random --games=2 --isolated --max-plies=4 --timeout-ms=2000 --heap-mb=128 --pgn=/tmp/student-smoke.pgn --csv=/tmp/student-smoke.csv
          test -s /tmp/student-smoke.pgn
          test -s /tmp/student-smoke.csv
          grep -q "CI Smoke" /tmp/student-smoke.csv

      - name: Run official student-only tournament mode
        run: |
          bash scripts/chess.sh tournament --students --games=2 --isolated --max-plies=4 --timeout-ms=2000 --heap-mb=128 --pgn=/tmp/iris-students.pgn --csv=/tmp/iris-students.csv
          test -s /tmp/iris-students.pgn
          test -s /tmp/iris-students.csv
          grep -q "CI Smoke" /tmp/iris-students.csv
          grep -q "CI Second" /tmp/iris-students.csv

  student-workflow-windows:
    name: Student workflow — Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Scaffold a student bot
        shell: pwsh
        run: ./scripts/new-student-bot.ps1 WinSmokeBot "CI Windows Student" "Windows Smoke" "Bot généré par le smoke-test Windows."

      - name: Build student bot and executable runner
        shell: pwsh
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate generated student bot
        shell: pwsh
        run: |
          $output = & ./scripts/chess.ps1 validate-students
          $output | Write-Host
          $text = $output -join "`n"
          if ($text -notmatch "Windows Smoke") { throw "Validation Windows absente." }

      - name: Verify automatic catalog registration
        shell: pwsh
        run: |
          $output = & ./scripts/chess.ps1 list
          $output | Write-Host
          $text = $output -join "`n"
          if ($text -notmatch "student-win-smoke") { throw "Catalogue Windows incomplet." }

      - name: Play isolated student duel
        shell: pwsh
        run: ./scripts/chess.ps1 console student-win-smoke random --isolated --max-plies=4 --timeout-ms=2000 --heap-mb=128

      - name: Run isolated Windows mini tournament and exports
        shell: pwsh
        run: |
          $pgn = Join-Path $env:RUNNER_TEMP "student-smoke.pgn"
          $csv = Join-Path $env:RUNNER_TEMP "student-smoke.csv"

          & ./scripts/chess.ps1 tournament student-win-smoke random --games=2 --isolated --max-plies=4 --timeout-ms=2000 --heap-mb=128 "--pgn=$pgn" "--csv=$csv"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $pgn)) { throw "PGN Windows absent." }
          if (-not (Test-Path $csv)) { throw "CSV Windows absent." }
          if ((Get-Item $pgn).Length -le 0) { throw "PGN Windows vide." }
          if ((Get-Item $csv).Length -le 0) { throw "CSV Windows vide." }

          $csvText = Get-Content $csv -Raw
          if ($csvText -notmatch "Windows Smoke") {
              throw "Le classement Windows ne contient pas le bot étudiant."
          }

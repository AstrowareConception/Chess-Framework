name: Student Elo Estimates

on:
  workflow_dispatch:
    inputs:
      games_per_reference:
        description: Parties par référence — nombre pair
        required: true
        default: '8'
        type: string
      references:
        description: Références séparées par des virgules ; vide = toutes
        required: false
        default: ''
        type: string
      seed:
        description: Seed reproductible
        required: true
        default: '20260927'
        type: string
      max_plies:
        description: Limite de demi-coups par partie
        required: true
        default: '400'
        type: string
      timeout_ms:
        description: Timeout par décision étudiant
        required: true
        default: '2000'
        type: string
      heap_mb:
        description: Heap JVM étudiant en MiB
        required: true
        default: '256'
        type: string

permissions:
  contents: read

jobs:
  estimate:
    name: Estimate merged student IRIS-Elo
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build runner
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Estimate all merged student bots
        shell: bash
        run: |
          set -euo pipefail

          REFS=""
          if [[ -n "${{ inputs.references }}" ]]; then
            REFS="--refs=${{ inputs.references }}"
          fi

          bash scripts/chess.sh elo-estimate-all             $REFS             --games="${{ inputs.games_per_reference }}"             --seed="${{ inputs.seed }}"             --max-plies="${{ inputs.max_plies }}"             --timeout-ms="${{ inputs.timeout_ms }}"             --heap-mb="${{ inputs.heap_mb }}"             --csv=iris-student-ratings.csv             | tee iris-student-ratings.log

      - name: Show rating table
        if: always()
        shell: bash
        run: |
          if [[ -f iris-student-ratings.csv ]]; then
            echo "### Estimations IRIS-Elo étudiantes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            column -s, -t < iris-student-ratings.csv >> "$GITHUB_STEP_SUMMARY" || cat iris-student-ratings.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload student Elo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-student-ratings-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 90
          path: |
            iris-student-ratings.csv
            iris-student-ratings.log

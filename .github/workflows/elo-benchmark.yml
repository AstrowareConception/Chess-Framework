name: Elo Benchmark

on:
  workflow_dispatch:
    inputs:
      population:
        description: Population à calibrer
        required: true
        default: reference
        type: choice
        options:
          - reference
          - students
          - all
      games_per_pair:
        description: Parties par paire — nombre pair
        required: true
        default: '4'
        type: string
      initial_elo:
        description: Elo initial commun
        required: true
        default: '1500'
        type: string
      k_factor:
        description: Facteur K
        required: true
        default: '24'
        type: string
      seed:
        description: Seed reproductible
        required: true
        default: '42'
        type: string
      max_plies:
        description: Limite de demi-coups par partie
        required: true
        default: '400'
        type: string
      isolated:
        description: Exécuter chaque bot dans une JVM isolée
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    name: Dynamic IRIS-Elo benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELO_POPULATION: ${{ inputs.population || 'reference' }}
      ELO_GAMES_PER_PAIR: ${{ inputs.games_per_pair || '4' }}
      ELO_INITIAL: ${{ inputs.initial_elo || '1500' }}
      ELO_K: ${{ inputs.k_factor || '24' }}
      ELO_SEED: ${{ inputs.seed || '42' }}
      ELO_MAX_PLIES: ${{ inputs.max_plies || '400' }}
      ELO_ISOLATED: ${{ inputs.isolated || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build runner
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Run benchmark
        shell: bash
        run: |
          set -euo pipefail

          POPULATION=""
          case "$ELO_POPULATION" in
            reference)
              POPULATION=""
              ;;
            students)
              POPULATION="--students"
              ;;
            all)
              POPULATION="--all"
              ;;
            *)
              echo "Population inconnue : $ELO_POPULATION"
              exit 2
              ;;
          esac

          ISOLATION=""
          if [[ "$ELO_ISOLATED" == "true" ]]; then
            ISOLATION="--isolated"
          fi

          bash scripts/chess.sh elo-benchmark \
            $POPULATION \
            --games="$ELO_GAMES_PER_PAIR" \
            --initial-elo="$ELO_INITIAL" \
            --k="$ELO_K" \
            --seed="$ELO_SEED" \
            --max-plies="$ELO_MAX_PLIES" \
            $ISOLATION \
            --csv=elo-final.csv \
            --history=elo-history.csv \
            | tee elo-benchmark.log

      - name: Show final ranking
        if: always()
        shell: bash
        run: |
          if [[ -f elo-final.csv ]]; then
            echo "### IRIS-Elo final" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            column -s, -t < elo-final.csv >> "$GITHUB_STEP_SUMMARY" || cat elo-final.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Elo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-elo-${{ env.ELO_POPULATION }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 90
          path: |
            elo-final.csv
            elo-history.csv
            elo-benchmark.log
